name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s tests -v
      - name: Check for accidental tokens
        run: |
          if grep -REn 'eyJhbGciOi|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{25,}|sk-[A-Za-z0-9]{25,}' --include='*.py' --include='*.json' --include='*.md' ma_provider; then
            exit 1
          fi
